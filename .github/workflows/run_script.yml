name: Scheduled Python Script

on:
  schedule:
    # This example runs every day at 08:37 AM UTC. 
    # Change "37 8" to your preferred time using Cron syntax.
    - cron: '20 10 * * *'
  workflow_dispatch: # This adds a manual "Run" button so you can test it instantly!

jobs:
  run-python-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Copy code into the cloud machine
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Script
        run: python script.py
