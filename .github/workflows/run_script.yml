name: Scheduled Python Script

on:
  schedule:
    - cron: '20 10 * * *'  # Runs automatically every day at 3:50 PM IST
  workflow_dispatch:      # Allows you to click the manual "Run workflow" testing button

jobs:
  run-python-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Copy repository code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Tools & Rclone
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg rclone
          python -m pip install --upgrade pip
          pip install openai-whisper

      - name: Configure Google Drive Access
        run: |
          mkdir -p ~/.config/rclone
          # This sets the header section to [drive] to match your configuration name
          echo "[drive]" > ~/.config/rclone/rclone.conf
          echo "${{ secrets.RCLONE_CONFIG_DATA }}" >> ~/.config/rclone/rclone.conf

      - name: Download Audio Files from Google Drive
        run: |
          mkdir -p Calls
          rclone copy drive:"My Drive/Calls" ./Calls -vv --drive-acknowledge-abuse || true

      - name: Execute Script
        run: python script.py

      - name: Upload Text Transcripts to Google Drive
        run: |
          rclone copy ./Transcripts drive:"My Drive/Transcripts" -vv --drive-acknowledge-abuse || true
